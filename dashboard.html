<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Sky Garden Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root { --ink:#3b2f4a; --card:#fff8ee; --accent:#ff8fa3; --gold:#ffc857; --gold-deep:#d99a2b; --surface:#f3e8d8; --line:#e4d6c2; --good:#2fae60; --bad:#e0566f; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:'Baloo 2', system-ui, sans-serif; color:var(--ink); background:#f6efe4; }
  main { max-width:1000px; margin:0 auto; padding:22px 16px 60px; }
  h1 { margin:0; font-size:30px; } h2 { margin:0 0 8px; font-size:20px; }
  .sub { opacity:.7; margin:2px 0 14px; }
  .tiles { display:grid; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); gap:10px; }
  .tile { background:var(--card); border-radius:18px; padding:12px 14px; box-shadow:0 4px 0 #0001; }
  .tile b { display:block; font-size:30px; line-height:1.1; } .tile span { font-size:14px; opacity:.75; }
  .card { background:var(--card); border-radius:20px; padding:16px 18px; margin-top:14px; box-shadow:0 4px 0 #0001; overflow-x:auto; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th { text-align:left; font-size:12px; opacity:.6; padding:4px 8px; border-bottom:2px solid var(--line); white-space:nowrap; }
  td { padding:6px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  .chip { display:inline-block; border-radius:999px; padding:0 9px; font-size:12px; font-weight:800; background:var(--surface); }
  .love { background:#dff5dc; color:#1f7a3f; } .okay { background:#fff3c9; color:#8a6a10; } .confused { background:#fde3e7; color:#b33a52; } .bored { background:#e8e2f5; color:#5a4b7a; }
  .bar { height:10px; background:var(--surface); border-radius:6px; overflow:hidden; margin-top:3px; } .bar i { display:block; height:100%; background:var(--gold); }
  .empty { opacity:.6; font-size:15px; }
  .lock { max-width:420px; margin:12vh auto; background:var(--card); border-radius:22px; padding:22px; box-shadow:0 5px 0 #0002; text-align:center; }
  input { width:100%; font:inherit; font-size:16px; border-radius:12px; border:2px solid var(--line); padding:8px 12px; margin-top:10px; }
  button { font:inherit; font-weight:800; border:0; background:var(--gold); color:var(--ink); border-radius:999px; padding:8px 20px; margin-top:12px; cursor:pointer; box-shadow:0 4px 0 var(--gold-deep); }
  button.ghost { background:var(--surface); box-shadow:0 4px 0 #cdbda6; }
  pre { white-space:pre-wrap; font-size:11px; opacity:.7; margin:4px 0 0; max-height:90px; overflow:auto; }
  .prop { background:var(--surface); border-radius:14px; padding:10px 12px; margin-top:8px; } .prop button { margin-top:6px; } .pv { margin:6px 0; }
  .sw { display:inline-block; width:18px; height:18px; border-radius:50%; vertical-align:middle; margin-left:4px; border:2px solid #fff; }
  .pz { display:block; font-size:13px; white-space:nowrap; } .pz input { width:auto; margin:0 4px 0 0; } select { font:inherit; border-radius:10px; border:2px solid var(--line); padding:4px 6px; }
  .row { display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; }
</style>
</head>
<body>
<main id="app"></main>
<script>
const API = 'https://sky-garden-saves.tupeloghost.workers.dev';
const app = document.getElementById('app');
const esc = t => String(t ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const ago = ms => { if (!ms) return ''; const m = Math.round((Date.now() - ms) / 60000); return m < 60 ? `${m} min ago` : m < 1440 ? `${Math.round(m/60)} hr ago` : `${Math.round(m/1440)} days ago`; };
const chapter = p => p.q1 < 5 ? `Ch 1, step ${p.q1}` : p.q2 < 5 ? `Ch 2, step ${p.q2}` : p.q3 < 7 ? `Ch 3, step ${p.q3}` : p.q4 < 5 ? `Ch 4, step ${p.q4}` : p.q5 < 6 ? `Ch 5, step ${p.q5}` : 'Story done';
let token = ''; try { token = localStorage.getItem('sg.admin') || ''; } catch {}

function lock(msg) {
  app.innerHTML = `<div class="lock"><h1>Sky Garden</h1><p class="sub">Private dashboard</p><p>${msg || 'Enter your dashboard key to see how players are doing.'}</p>
    <input id="k" type="password" placeholder="Dashboard key" autocomplete="off"><button id="go">Open dashboard</button></div>`;
  document.getElementById('go').onclick = () => { token = document.getElementById('k').value.trim(); try { localStorage.setItem('sg.admin', token); } catch {} load(); };
}
async function load() {
  if (!token) return lock();
  app.innerHTML = '<p class="sub">Loading...</p>';
  let d; try { const r = await fetch(`${API}/admin`, { headers:{ Authorization:'Bearer ' + token } }); if (r.status === 403) { try { localStorage.removeItem('sg.admin'); } catch {} return lock('That key did not work. Try again.'); } d = await r.json(); }
  catch { return lock('Could not reach Sky Garden. Check your internet and try again.'); }
  const P = d.players, week = Date.now() - 7 * 864e5, back = P.filter(p => (p.playdays || 0) > 1).length, fJoined = d.founders.filter(f => f.used_at).length;
  const moods = {}; d.feedback.forEach(f => { if (f.mood) moods[f.mood] = (moods[f.mood] || 0) + 1; });
  const missions = {}; d.feedback.filter(f => (f.place || '').startsWith('Mission:')).forEach(f => { const k = f.place.slice(9); missions[k] = missions[k] || {}; missions[k][f.mood] = (missions[k][f.mood] || 0) + 1; });
  const who = code => (d.founders.find(f => f.code === code) || {}).label || code || 'someone';
  const pending = d.proposals.filter(p => p.status === 'pending'), decided = d.proposals.filter(p => p.status !== 'pending').slice(0, 20);
  const weekAgo = Date.now() - 7 * 864e5, heads = [];
  d.founders.forEach(f => { const ev = d.events.filter(e => e.code === f.code && e.at > weekAgo), n = k => ev.filter(e => e.kind === k).length;
    if (n('report') >= 3) heads.push(`${esc(f.label)} reported ${n('report')} shops this week.`);
    if (n('feedback') >= 20) heads.push(`${esc(f.label)} sent ${n('feedback')} feedback notes this week, much more than usual.`);
    if (n('propose') >= 5) heads.push(`${esc(f.label)} made ${n('propose')} suggestions this week.`);
    if (d.proposals.filter(p => p.code === f.code && p.status === 'rejected').length >= 3) heads.push(`You have said no to ${esc(f.label)}'s suggestions 3 or more times.`); });
  const histHtml = ev => ev.length ? `<table><tr><th>When</th><th>Who</th><th>What</th><th>Details</th></tr>${ev.slice(0, 150).map(e => `<tr><td>${ago(e.at)}</td><td>${esc(who(e.code))}</td><td><span class="chip">${esc(e.kind)}</span></td><td>${esc(e.detail)}</td></tr>`).join('')}</table>` : '<p class="empty">Nothing yet.</p>';
  const LMN = { fountain:'Fountain', sundial:'Sundial garden', belltower:'Bell tower', stonecircle:'Standing stones' };
  const landmarkPreview = l => `<b style="font-size:18px">${esc(LMN[l.type] || l.type)}</b> <span class="sw" style="background:#${(l.color >>> 0).toString(16).padStart(6,'0')}"></span><span class="sw" style="background:#${(l.color2 >>> 0).toString(16).padStart(6,'0')}"></span>`;
  const stops = {}; P.forEach(p => { const c = chapter(p).replace(/, step.*/, ''); stops[c] = (stops[c] || 0) + 1; });
  app.innerHTML = `
    <div class="row"><div><h1>Sky Garden</h1><p class="sub">Updated ${new Date(d.now).toLocaleString()}</p></div><div><button id="re">Refresh</button> <button id="out" class="ghost">Lock</button></div></div>
    <div class="tiles">
      <div class="tile"><b>${P.length}</b><span>players</span></div>
      <div class="tile"><b>${P.filter(p => p.created > week).length}</b><span>new this week</span></div>
      <div class="tile"><b>${back}</b><span>came back on another day</span></div>
      <div class="tile"><b>${fJoined} / ${d.founders.length}</b><span>tester codes used</span></div>
      <div class="tile"><b>${d.bugs.reduce((a, b) => a + b.n, 0)}</b><span>bug reports</span></div>
      <div class="tile"><b>${d.feedback.length}</b><span>recent feedback notes</span></div>
    </div>

    ${heads.length ? `<div class="card" style="border:3px solid var(--bad)"><h2>Heads-up</h2>${heads.map(h => `<p>⚠️ ${h}</p>`).join('')}</div>` : ''}

    <div class="card"><h2>Waiting for your approval</h2>${pending.length ? pending.map(p => `<div class="prop"><div><span class="chip">${p.kind === 'placename' ? 'Place name' : 'Landmark'}</span> from ${esc(who(p.code))} · ${ago(p.created)}</div>
      <div class="pv">${p.kind === 'placename' ? `<b style="font-size:20px">${esc(JSON.parse(p.payload).name)}</b> <span class="sub">(for the village square)</span>` : landmarkPreview(JSON.parse(p.payload))}</div>
      <div><button data-dec="${p.id}:approved">Approve</button> <button class="ghost" data-dec="${p.id}:rejected">Say no</button></div></div>`).join('') : '<p class="empty">Nothing waiting. When Keepers suggest something, it shows up here first.</p>'}
      ${decided.length ? `<details style="margin-top:10px"><summary>Past decisions</summary>${decided.map(p => `<p><span class="chip ${p.status === 'approved' ? 'love' : 'confused'}">${p.status}</span> ${p.kind === 'placename' ? esc(JSON.parse(p.payload).name) : 'Landmark: ' + esc(LMN[JSON.parse(p.payload).type] || JSON.parse(p.payload).type)} · ${esc(who(p.code))}</p>`).join('')}</details>` : ''}</div>

    <div class="card"><h2>Founders and Keepers</h2><p class="sub">Change anyone's level, pause a privilege, or switch someone off. Changes apply the next time they open the game.</p>
      ${d.founders.length ? `<table><tr><th>For</th><th>Status</th><th>Level</th><th>Secret legend</th><th>Paused</th><th></th></tr>${d.founders.map(f => { const pz = JSON.parse(f.paused || '[]');
        return `<tr><td><b>${esc(f.label)}</b><br><span class="sub">${esc(f.code)}${f.name ? ' · ' + esc(f.name) : ''}</span></td><td>${f.revoked ? '<span class="chip confused">switched off</span>' : f.used_at ? 'Joined ' + ago(f.used_at) : 'Not used yet'}</td>
        <td><select data-lvl="${f.code}">${[[1,'Founder'],[2,'Keeper'],[3,'Elder Keeper'],[4,'Creator (you)']].map(([v, n]) => `<option value="${v}" ${f.level === v ? 'selected' : ''}>${n}</option>`).join('')}</select></td>
        <td><select data-myth="${f.code}">${[['','None'],['simurgh','Simurgh'],['ziz','Ziz'],['ibis','Ibis of Thoth']].map(([v, n]) => `<option value="${v}" ${(f.myth || '') === v ? 'selected' : ''}>${n}</option>`).join('')}</select>${f.seen ? `<br><span class="sub">seen ${f.seen}×</span>` : ''}${(d.extra && d.extra.controls && d.extra.controls[f.code]) || ''}</td>
        <td>${[['propose','Suggestions'],['vote','Voting'],['missions','Missions'],['testisland','Test island'],['myth','Legend']].map(([k, n]) => `<label class="pz"><input type="checkbox" data-pz="${f.code}" value="${k}" ${pz.includes(k) ? 'checked' : ''}> ${n}</label>`).join('')}</td>
        <td><button class="ghost" data-hist="${f.code}">History</button> <button class="ghost" data-rev="${f.code}:${f.revoked ? 0 : 1}">${f.revoked ? 'Switch back on' : 'Switch off'}</button></td></tr>`; }).join('')}</table>` : '<p class="empty">No tester codes yet.</p>'}</div>

    <div class="card" id="histCard"><h2>Activity history</h2><p class="sub" id="histFor">Everyone, newest first. Tap History next to a person to see just theirs.</p><div id="hist">${histHtml(d.events)}</div></div>

    <div class="card"><h2>Missions from you</h2><p class="sub">Send a mission to every founder, a tier, or one person. It shows up on their path in the game. You can also do this in the game with the Quill.</p>
      <input id="mt" maxlength="80" placeholder="Mission, like: Plant something for a neighbor">
      <input id="mh" maxlength="240" placeholder="How or why (optional)" style="margin-top:10px">
      <select id="ma" style="margin-top:10px"><option value="founders">Every founder</option><option value="keepers">Keepers and Elders</option><option value="elders">Elders only</option>${d.founders.filter(f => f.used_at && f.level < 4).map(f => `<option value="code:${f.code}">${esc(f.label)} only</option>`).join('')}</select>
      <select id="mr" style="margin-top:10px">${[25, 50, 100, 200].map(n => `<option value="${n}" ${n === 50 ? 'selected' : ''}>${n} coins</option>`).join('')}</select>
      <button id="mgo">Send the mission</button> <span id="mmsg" class="sub"></span>
      ${(d.cmissions || []).length ? `<table style="margin-top:12px"><tr><th>Mission</th><th>For</th><th>Done by</th><th></th></tr>${d.cmissions.map(m => { const dn = JSON.parse(m.done || '[]');
        return `<tr><td><b>${esc(m.title)}</b>${m.how ? `<br><span class="sub">${esc(m.how)}</span>` : ''}</td><td>${esc(m.audience.startsWith('code:') ? who(m.audience.slice(5)) : m.audience)}</td><td>${dn.map(x => `${esc(who(x.code))}${x.note ? `: <i>${esc(x.note)}</i>` : ''}`).join('<br>') || '<span class="sub">No one yet</span>'}</td><td>${m.active ? `<button class="ghost" data-moff="${m.id}">End</button>` : '<span class="sub">ended</span>'}</td></tr>`; }).join('')}</table>` : ''}</div>

    <div class="card"><h2>Start a council vote</h2><p class="sub">Starting a new vote closes the old one for the same group.</p>
      <input id="pq" placeholder="Question, like: Which traveler should move into the village next?">
      <textarea id="po" rows="4" placeholder="One choice per line" style="width:100%;font:inherit;font-size:16px;border-radius:12px;border:2px solid var(--line);padding:8px 12px;margin-top:10px"></textarea>
      <select id="pa" style="margin-top:10px"><option value="all">Everyone votes</option><option value="keepers">Keepers' Council (Keepers and Elders)</option><option value="elders">Elders' Council (Elders only)</option></select>
      <button id="pgo">Start the vote</button> <span id="pmsg" class="sub"></span></div>

    <div class="card"><h2>Where players are in the story</h2>${Object.entries(stops).map(([c, n]) => `<div style="margin-top:6px"><b>${c}</b>: ${n}<div class="bar"><i style="width:${Math.round(n / P.length * 100)}%"></i></div></div>`).join('') || '<p class="empty">No players yet.</p>'}</div>

    <div class="card"><h2>Players</h2>${P.length ? `<table><tr><th>Name</th><th>Story</th><th>Game day</th><th>Days played</th><th>Missions</th><th>Last seen</th></tr>${P.map(p => `<tr><td>${esc(p.name || '(no name)')}${p.founder ? ' <span class="chip">✦ founder</span>' : ''}</td><td>${chapter(p)}</td><td>${p.day ?? ''}</td><td>${p.playdays ?? ''}</td><td>${p.missions ? Object.keys(JSON.parse(p.missions)).length : ''}</td><td>${ago(p.updated)}</td></tr>`).join('')}</table>` : '<p class="empty">No players yet.</p>'}</div>

    <div class="card"><h2>How missions felt</h2>${Object.keys(missions).length ? `<table><tr><th>Mission</th><th>Loved it</th><th>Okay</th><th>Confusing</th></tr>${Object.entries(missions).map(([k, m]) => `<tr><td>${esc(k)}</td><td>${m.love || 0}</td><td>${m.okay || 0}</td><td>${m.confused || 0}</td></tr>`).join('')}</table>` : '<p class="empty">No mission reactions yet.</p>'}</div>

    <div class="card"><h2>Feedback</h2><p>${Object.entries(moods).map(([m, n]) => `<span class="chip ${m}">${m} ${n}</span>`).join(' ')}</p>${d.feedback.length ? `<table><tr><th>When</th><th>Mood</th><th>Note</th><th>Where they were</th></tr>${d.feedback.map(f => `<tr><td>${ago(f.at)}</td><td>${f.mood ? `<span class="chip ${f.mood}">${f.mood}</span>` : ''}</td><td>${esc(f.note)}</td><td>${esc(f.place)}</td></tr>`).join('')}</table>` : '<p class="empty">No feedback yet.</p>'}</div>

    <div class="card"><h2>Bugs</h2>${d.bugs.length ? `<table><tr><th>Error</th><th>Times</th><th>Last</th><th>Where they were</th></tr>${d.bugs.map(b => `<tr><td>${esc(b.msg)}<pre>${esc(b.stack)}</pre></td><td>${b.n}</td><td>${ago(b.last)}</td><td>${esc(b.place)}</td></tr>`).join('')}</table>` : '<p class="empty">No bugs reported. Nice!</p>'}</div>

    <div class="card"><h2>Town Hall votes</h2>${d.polls.length ? d.polls.map(p => { const opts = JSON.parse(p.options), counts = JSON.parse(p.counts || '[]'), total = counts.reduce((a, c) => a + c.n, 0) || 1;
      return `<p><b>${esc(p.question)}</b> ${p.open ? '<span class="chip love">open</span>' : '<span class="chip">closed</span>'}</p>${opts.map((o, i) => { const n = (counts.find(c => c.c === i) || {}).n || 0; return `<div style="margin-top:4px">${esc(o)}: ${n}<div class="bar"><i style="width:${Math.round(n / total * 100)}%"></i></div></div>`; }).join('')}`; }).join('<hr>') : '<p class="empty">No votes yet.</p>'}</div>`;
  const act = async body => { const r = await fetch(`${API}/admin/act`, { method:'POST', headers:{ Authorization:'Bearer ' + token, 'Content-Type':'application/json' }, body:JSON.stringify(body) }); return r.ok; };
  document.querySelectorAll('[data-dec]').forEach(b => b.onclick = async () => { const [id, v] = b.dataset.dec.split(':'); b.disabled = true; if (await act({ action:'decide', id:+id, value:v })) load(); });
  document.querySelectorAll('[data-actjson]').forEach(s => s.onchange = async () => { await act({ ...JSON.parse(s.dataset.actjson), value:s.value }); load(); });
  document.querySelectorAll('[data-myth]').forEach(s => s.onchange = async () => { await act({ action:'myth', code:s.dataset.myth, value:s.value }); load(); });
  document.querySelectorAll('[data-moff]').forEach(b => b.onclick = async () => { if (await act({ action:'missionoff', id:+b.dataset.moff })) load(); });
  { const mg = document.getElementById('mgo'); if (mg) mg.onclick = async () => { const title = document.getElementById('mt').value.trim(); if (!title) { document.getElementById('mmsg').textContent = 'Write the mission first.'; return; }
    if (await act({ action:'mission', title, how:document.getElementById('mh').value.trim(), audience:document.getElementById('ma').value, reward:+document.getElementById('mr').value })) load(); else document.getElementById('mmsg').textContent = 'Could not send it.'; }; }
  document.querySelectorAll('[data-lvl]').forEach(s => s.onchange = async () => { await act({ action:'level', code:s.dataset.lvl, value:+s.value }); load(); });
  document.querySelectorAll('[data-pz]').forEach(c => c.onchange = async () => { const code = c.dataset.pz, vals = [...document.querySelectorAll(`[data-pz="${code}"]:checked`)].map(x => x.value); await act({ action:'paused', code, value:vals }); });
  document.querySelectorAll('[data-rev]').forEach(b => b.onclick = async () => { const [code, v] = b.dataset.rev.split(':'); if (v === '1' && !confirm('Switch off this person\'s founder extras? You can switch them back on anytime.')) return; await act({ action:'revoke', code, value:v === '1' }); load(); });
  document.querySelectorAll('[data-hist]').forEach(b => b.onclick = () => { const code = b.dataset.hist; document.getElementById('hist').innerHTML = histHtml(d.events.filter(e => e.code === code)); document.getElementById('histFor').textContent = 'Showing ' + who(code) + ' only.'; document.getElementById('histCard').scrollIntoView({ behavior:'smooth' }); });
  document.getElementById('pgo').onclick = async () => { const q = document.getElementById('pq').value.trim(), o = document.getElementById('po').value.split('\n').map(x => x.trim()).filter(Boolean), a = document.getElementById('pa').value;
    if (!q || o.length < 2) { document.getElementById('pmsg').textContent = 'Add a question and at least 2 choices.'; return; }
    if (await act({ action:'poll', question:q, options:o, audience:a })) load(); else document.getElementById('pmsg').textContent = 'Could not start the vote.'; };
  document.getElementById('re').onclick = load;
  document.getElementById('out').onclick = () => { token = ''; try { localStorage.removeItem('sg.admin'); } catch {} lock(); };
}
load();
</script>
</body>
</html>
